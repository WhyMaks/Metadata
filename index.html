<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MetaData</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #1F1F24;
    --field: #42445a;
    --field-focus: #4b4d66;
    --text: #f5f4f0;
    --text-dim: #b8b8c4;
    --accent: #e7a256;
    --error: #e2897a;
    --ok: #9ecb8f;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Space Grotesk', sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 64px 24px;
  }

  .wrap { width: 100%; max-width: 460px; }

  h1 {
    font-size: 22px;
    font-weight: 700;
    margin: 0 0 44px;
  }

  label {
    display: block;
    font-size: 22px;
    font-weight: 700;
    margin-bottom: 14px;
  }

  .field { margin-bottom: 36px; }

  .dropzone {
    border: 2px dashed var(--field);
    border-radius: 14px;
    padding: 36px 20px;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.2s ease, background 0.2s ease;
  }
  .dropzone:hover, .dropzone.dragover {
    border-color: var(--accent);
    background: var(--field);
  }
  .dropzone input[type="file"] { display: none; }
  .dropzone .hint { color: var(--text-dim); font-size: 14px; }
  .dropzone .hint strong { color: var(--text); }

  .file-info {
    font-family: ui-monospace, 'JetBrains Mono', monospace;
    font-size: 13px;
    color: var(--text-dim);
    margin-top: 10px;
  }

  .collapsible {
    display: grid;
    grid-template-rows: 0fr;
    opacity: 0;
    margin-bottom: 0;
    transition: grid-template-rows 0.35s ease, opacity 0.25s ease, margin-bottom 0.35s ease;
  }
  .collapsible.open {
    grid-template-rows: 1fr;
    opacity: 1;
    margin-bottom: 36px;
  }
  .collapsible > .collapsible-inner { overflow: hidden; min-height: 0; }

  .scan-box {
    font-family: ui-monospace, 'JetBrains Mono', monospace;
    font-size: 13px;
    color: var(--text-dim);
    background: var(--field);
    border-radius: 10px;
    padding: 14px 16px;
    line-height: 1.7;
  }
  .scan-box .meta-line { color: var(--error); }
  .scan-box .clean-line { color: var(--ok); }
  .scan-box .read-line { color: var(--text); word-break: break-word; }
  .scan-box .read-line span.src { color: var(--text-dim); }
  .scan-summary { font-weight: 700; color: var(--text); margin-bottom: 8px; font-family: 'Space Grotesk', sans-serif; }

  button.go {
    width: 100%;
    background: var(--accent);
    color: #2a1d0c;
    border: none;
    border-radius: 14px;
    padding: 18px;
    font-family: inherit;
    font-size: 18px;
    font-weight: 700;
    cursor: pointer;
    margin-bottom: 14px;
    transition: opacity 0.2s ease, transform 0.15s ease;
  }
  button.go:hover { opacity: 0.92; }
  button.go:active { opacity: 0.8; transform: scale(0.98); }
  button.go:disabled { opacity: 0.4; cursor: not-allowed; }

  .status { font-size: 14px; min-height: 18px; margin-bottom: 6px; }
  .status.error { color: var(--error); }
  .status.ok { color: var(--ok); }

  .result-preview {
    display: flex;
    align-items: center;
    gap: 14px;
    background: var(--field);
    border-radius: 14px;
    padding: 14px;
  }
  .result-preview img {
    width: 56px;
    height: 56px;
    object-fit: cover;
    border-radius: 8px;
    flex-shrink: 0;
  }
  .result-preview .result-text { font-size: 13px; color: var(--text-dim); line-height: 1.5; }

  a.download-link {
    display: block;
    text-align: center;
    background: var(--accent);
    color: #2a1d0c;
    text-decoration: none;
    font-weight: 700;
    border-radius: 14px;
    padding: 16px;
    margin-top: 14px;
  }
  a.download-link:hover { opacity: 0.92; }

  .quality-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: 10px;
  }
  .quality-row input[type="range"] { flex: 1; accent-color: var(--accent); }
  .quality-row span { font-family: ui-monospace, monospace; font-size: 13px; color: var(--text-dim); width: 36px; text-align: right; }

  .mode-row {
    display: flex;
    gap: 10px;
  }
  .mode-btn {
    flex: 1;
    background: var(--field);
    color: var(--text-dim);
    border: none;
    border-radius: 14px;
    padding: 14px;
    font-family: inherit;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.2s ease, color 0.2s ease;
  }
  .mode-btn.active {
    background: var(--accent);
    color: #2a1d0c;
  }

  .note {
    font-size: 13px;
    color: var(--text-dim);
    line-height: 1.6;
    margin-top: 56px;
  }
</style>
</head>
<body>
<div class="wrap">

  <h1>MetaData</h1>

  <div class="field">
    <div class="mode-row" id="modeRow">
      <button class="mode-btn active" data-mode="read">read</button>
      <button class="mode-btn" data-mode="wipe">wipe</button>
    </div>
  </div>

  <div class="field">
    <label>file</label>
    <div class="dropzone" id="dropzone">
      <input type="file" id="fileInput" accept="image/jpeg,image/png,image/webp">
      <div class="hint"><strong>click to choose</strong> or drag an image here<br>JPEG / PNG / WebP</div>
      <div class="file-info" id="fileInfo"></div>
    </div>
  </div>

  <div class="collapsible" id="scanSection">
    <div class="collapsible-inner">
      <label>found & read</label>
      <div class="scan-box" id="scanBox"></div>
    </div>
  </div>

  <div class="collapsible" id="qualitySection">
    <div class="collapsible-inner">
      <label>jpeg quality</label>
      <div class="quality-row">
        <input type="range" id="qualitySlider" min="0.5" max="1" step="0.01" value="0.92">
        <span id="qualityValue">92%</span>
      </div>
    </div>
  </div>

  <button class="go" id="readBtn" onclick="doRead()" disabled>read metadata</button>
  <button class="go" id="goBtn" onclick="run()" disabled style="display:none">wipe metadata</button>
  <div class="status" id="status"></div>

  <div class="collapsible" id="resultSection">
    <div class="collapsible-inner">
      <label>result</label>
      <div class="result-preview">
        <img id="resultThumb" alt="cleaned image">
        <div class="result-text" id="resultText"></div>
      </div>
      <a class="download-link" id="downloadLink" download>download cleaned file</a>
    </div>
  </div>

  <div class="note">
  </div>

</div>

<script src="metawipe.js"></script>
<script>
let selectedFile = null;
let mode = 'read';

const dropzone = document.getElementById('dropzone');
const fileInput = document.getElementById('fileInput');
const qualitySlider = document.getElementById('qualitySlider');
const qualityValue = document.getElementById('qualityValue');
const modeRow = document.getElementById('modeRow');
const readBtn = document.getElementById('readBtn');
const goBtn = document.getElementById('goBtn');

modeRow.addEventListener('click', (e) => {
  const btn = e.target.closest('.mode-btn');
  if (!btn) return;
  mode = btn.dataset.mode;
  modeRow.querySelectorAll('.mode-btn').forEach(b => b.classList.toggle('active', b === btn));
  updateModeUI();
});

function updateModeUI() {
  const isRead = mode === 'read';
  readBtn.style.display = isRead ? '' : 'none';
  goBtn.style.display = isRead ? 'none' : '';
  // quality only matters for wipe of JPEGs
  const showQuality = !isRead && selectedFile && selectedFile.type === 'image/jpeg';
  document.getElementById('qualitySection').classList.toggle('open', !!showQuality);
  if (isRead) {
    document.getElementById('resultSection').classList.remove('open');
  }
}

dropzone.addEventListener('click', () => fileInput.click());
dropzone.addEventListener('dragover', (e) => { e.preventDefault(); dropzone.classList.add('dragover'); });
dropzone.addEventListener('dragleave', () => dropzone.classList.remove('dragover'));
dropzone.addEventListener('drop', (e) => {
  e.preventDefault();
  dropzone.classList.remove('dragover');
  if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
});
fileInput.addEventListener('change', (e) => {
  if (e.target.files.length) handleFile(e.target.files[0]);
});

qualitySlider.addEventListener('input', () => {
  qualityValue.textContent = Math.round(qualitySlider.value * 100) + '%';
});

function formatBytes(n) {
  if (n < 1024) return n + ' B';
  if (n < 1024 * 1024) return (n / 1024).toFixed(1) + ' KB';
  return (n / (1024 * 1024)).toFixed(2) + ' MB';
}

function escapeHtml(s) {
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

async function handleFile(file) {
  selectedFile = file;
  document.getElementById('fileInfo').textContent = `${file.name} -- ${formatBytes(file.size)}`;
  document.getElementById('resultSection').classList.remove('open');
  document.getElementById('status').textContent = '';

  const buffer = await file.arrayBuffer();
  const report = scanMetadata(buffer);
  let readReport = { fields: [] };
  try {
    if (typeof readMetadataAsync === 'function') {
      readReport = await readMetadataAsync(buffer);
    } else if (typeof readMetadata === 'function') {
      readReport = readMetadata(buffer);
    }
  } catch (e) { readReport = { fields: [] }; }
  renderScan(report, readReport);

  readBtn.disabled = false;
  goBtn.disabled = false;
  updateModeUI();
}

function renderScan(report, readReport) {
  const box = document.getElementById('scanBox');
  let html = '';

  if (report.format === 'other') {
    html += `<div class="scan-summary">unrecognised format -- will still be re-encoded and stripped</div>`;
  } else if (report.metadataCount === 0) {
    html += `<div class="scan-summary clean-line">no metadata segments found</div>`;
  } else {
    html += `<div class="scan-summary meta-line">${report.metadataCount} metadata segment(s), ~${formatBytes(report.metadataBytes)}</div>`;
  }

  report.segments.forEach(s => {
    const cls = s.isMetadata ? 'meta-line' : '';
    html += `<div class="${cls}">${escapeHtml(s.name)} -- ${s.bytes}b${s.isMetadata ? ' [metadata]' : ''}</div>`;
  });

  const fields = (readReport && readReport.fields) || [];
  if (fields.length) {
    html += `<div class="scan-summary" style="margin-top:10px">read values:</div>`;
    fields.forEach(f => {
      html += `<div class="read-line"><span class="src">${escapeHtml(f.source)} / ${escapeHtml(f.name)}:</span> ${escapeHtml(f.value)}</div>`;
    });
  } else if (report.format !== 'other') {
    html += `<div class="scan-summary" style="margin-top:10px">read values: none found</div>`;
  }

  box.innerHTML = html || '<div>no structured segments recognised</div>';
  document.getElementById('scanSection').classList.add('open');
}

async function doRead() {
  const statusEl = document.getElementById('status');
  statusEl.className = 'status';

  if (!selectedFile) { statusEl.textContent = 'choose a file first'; statusEl.className = 'status error'; return; }

  readBtn.disabled = true;
  const originalText = readBtn.textContent;
  readBtn.textContent = 'reading...';

  try {
    const buffer = await selectedFile.arrayBuffer();
    const report = scanMetadata(buffer);
    const readReport = await readMetadataAsync(buffer);
    renderScan(report, readReport);
    const n = readReport.fields.length;
    statusEl.textContent = n === 0 ? 'no readable metadata values found' : `read ${n} value(s)`;
    statusEl.className = 'status ok';
  } catch (err) {
    statusEl.textContent = err.message;
    statusEl.className = 'status error';
  } finally {
    readBtn.disabled = false;
    readBtn.textContent = originalText;
  }
}

async function run() {
  const statusEl = document.getElementById('status');
  document.getElementById('resultSection').classList.remove('open');
  statusEl.className = 'status';

  if (!selectedFile) { statusEl.textContent = 'choose a file first'; statusEl.className = 'status error'; return; }

  const goBtn = document.getElementById('goBtn');
  goBtn.disabled = true;
  const originalText = goBtn.textContent;
  goBtn.textContent = 'wiping...';

  try {
    const quality = parseFloat(qualitySlider.value);
    const cleanedBlob = await stripMetadata(selectedFile, quality);
    const cleanedBuffer = await cleanedBlob.arrayBuffer();
    const verifyReport = scanMetadata(cleanedBuffer);

    const url = URL.createObjectURL(cleanedBlob);
    document.getElementById('resultThumb').src = url;

    const ext = cleanedBlob.type === 'image/png' ? 'png' : 'jpg';
    const baseName = selectedFile.name.replace(/\.[^.]+$/, '');
    const downloadLink = document.getElementById('downloadLink');
    downloadLink.href = url;
    downloadLink.download = `${baseName}_clean.${ext}`;

    document.getElementById('resultText').innerHTML =
      `${formatBytes(selectedFile.size)} &rarr; ${formatBytes(cleanedBlob.size)}<br>` +
      (verifyReport.metadataCount === 0
        ? '<span style="color: var(--ok)">verified: 0 metadata segments remaining</span>'
        : `<span style="color: var(--error)">warning: ${verifyReport.metadataCount} segments still detected</span>`);

    document.getElementById('resultSection').classList.add('open');
    statusEl.textContent = '';
  } catch (err) {
    statusEl.textContent = err.message;
    statusEl.className = 'status error';
  } finally {
    goBtn.disabled = false;
    goBtn.textContent = originalText;
  }
}
</script>
</body>
</html>
